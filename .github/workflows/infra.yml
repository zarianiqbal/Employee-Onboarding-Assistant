name: Infra CI

# Format-check and validate the Terraform configuration. `plan`/`apply` run in a
# gated environment with OIDC federation (no long-lived cloud credentials).

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']

defaults:
  run:
    working-directory: infra

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
