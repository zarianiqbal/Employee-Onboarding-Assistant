[project]
name = "onboarding-backend"
version = "0.1.0"
description = "FastAPI backend for the Employee Onboarding Assistant"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, comprehensions
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["B008"]  # FastAPI uses function calls (Depends) in argument defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
